<!doctype html>
<html lang="pt">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="theme-color" content="#0f6f8a">
<link rel="manifest" href="manifest.webmanifest">
<link rel="apple-touch-icon" href="icon-192.png">
<title>Beach Brain · Lagos</title>
<style>
:root{--sand:#f2dfb8;--foam:#fffaf0;--ocean:#0f6f8a;--deep:#133f52;--cliff:#c9743b;--ink:#17313a;--muted:#6b7474;--line:#d7c6a7;--good:#dff1df;--bad:#f3dddd}
*{box-sizing:border-box}
body{margin:0;background:linear-gradient(180deg,#c8eaf1 0 20%,var(--sand) 20% 100%);color:var(--ink);font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif;min-height:100vh}
.wrap{max-width:760px;margin:auto;padding:24px 16px 52px}
.hero{background:linear-gradient(145deg,rgba(255,250,240,.97),rgba(255,244,222,.95));border:1px solid rgba(255,255,255,.8);border-radius:28px;padding:22px;box-shadow:0 12px 35px rgba(18,67,90,.12);position:relative;overflow:hidden}
.hero:after{content:"";position:absolute;right:-35px;bottom:-38px;width:170px;height:105px;background:var(--cliff);border-radius:65% 0 0 0;opacity:.24}
h1{margin:0;font-size:32px;letter-spacing:-.7px}.sub{font-size:13px;color:var(--muted);margin-top:6px;max-width:560px}
.wave{height:7px;border-radius:999px;background:linear-gradient(90deg,var(--ocean),#7dced9,var(--ocean));margin-top:16px}
.card{background:rgba(255,250,240,.97);border:1px solid var(--line);border-radius:22px;padding:18px;margin-top:14px;box-shadow:0 8px 22px rgba(18,67,90,.07)}
.menu{display:grid;grid-template-columns:repeat(3,1fr);gap:10px}
button,select,input{font:inherit}
button{border:1px solid var(--line);background:#fffdf8;border-radius:15px;padding:13px;cursor:pointer;color:var(--ink)}
button.primary,.menu button.active{background:var(--ocean);color:white;border-color:var(--ocean)}
.row{display:flex;gap:9px;flex-wrap:wrap;align-items:center}
select,input{border:1px solid var(--line);border-radius:12px;padding:11px;background:#fffdf8;color:var(--ink)}
.hidden{display:none!important}.big{font-size:23px;font-weight:760}.score{font-size:34px;font-weight:850;margin:16px 0}
.meta{display:flex;justify-content:space-between;font-size:12px;color:var(--muted);margin-bottom:9px}.prompt{font-size:18px;line-height:1.48;margin:12px 0 16px}
.opts{display:grid;gap:9px}.opt{text-align:left}.good{background:var(--good)!important}.bad{background:var(--bad)!important}
.note{background:#fff3d8;padding:12px;border-radius:12px;margin-top:12px;line-height:1.4}.code{font:800 25px ui-monospace,monospace;letter-spacing:2px;text-align:center;padding:12px;background:#eaf7fa;border-radius:12px}
.tiny{font-size:12px;color:var(--muted)}.badge{display:inline-block;background:#e9f6f8;color:var(--deep);border:1px solid #b9dce3;border-radius:999px;padding:5px 9px;font-size:11px;font-weight:700;margin-top:10px}
hr{border:0;border-top:1px solid var(--line);margin:16px 0}
@media(max-width:520px){.menu{grid-template-columns:1fr}}
</style>
</head>
<body>
<div class="wrap">
<div class="hero"><h1>Beach Brain · Lagos</h1><div class="sub">72 desafios para Meia Praia, Camilo ou Ponta da Piedade. Lógica, probabilidade, estratégia, matemática, padrões, linguagem e pensamento lateral.</div><div class="badge">ATLÂNTICO MODE</div><div class="wave"></div></div>
<div class="card menu"><button id="soloBtn">Solo</button><button id="coopBtn">Co-op</button><button id="duelBtn">Duelo</button></div>
<div class="card" id="setup"></div>
<div class="card hidden" id="game">
<div class="meta"><span id="type"></span><span id="diff"></span></div>
<div class="big" id="round"></div><div class="prompt" id="prompt"></div><div class="opts" id="opts"></div><div id="note"></div>
<div class="row" style="margin-top:14px"><button id="hintBtn">Dica</button><button class="primary" id="nextBtn">Próximo</button></div>
</div>
<div class="card hidden" id="result"></div>
</div>
<script src="app.js"></script>
<script>
if("serviceWorker" in navigator){window.addEventListener("load",()=>navigator.serviceWorker.register("./sw.js").catch(()=>{}));}
</script>
</body></html>
